<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procomil Admin Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="loginView" class="login">
    <form id="loginForm" class="login-card">
      <h1>Admin Login</h1>
      <p>Procomil Order Management</p>
      <input id="username" placeholder="Username" required>
      <input id="password" type="password" placeholder="Password" required>
      <button>Login</button>
      <small id="loginError"></small>
    </form>
  </div>

  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <h2>Procomil</h2>
      <button data-page="dashboard">📊 Dashboard</button>
      <button data-page="orders">📦 Orders</button>
      <button data-page="customers">👤 Customers</button>
      <button data-page="users">👥 Users</button>
      <button id="logout">🚪 Logout</button>
    </aside>

    <main class="main">
      <header><h1 id="pageTitle">Dashboard</h1></header>

      <section id="dashboard" class="page">
        <div class="cards">
          <div><span>Total Orders</span><b id="totalOrders">0</b></div>
          <div><span>Pending</span><b id="pendingOrders">0</b></div>
          <div><span>Confirmed</span><b id="confirmedOrders">0</b></div>
          <div><span>Total Sales</span><b id="totalSales">0৳</b></div>
        </div>
      </section>

      <section id="orders" class="page hidden">
        <div class="toolbar">
          <input id="orderSearch" placeholder="Search name / phone / order ID">
          <select id="statusFilter">
            <option value="">All Status</option>
            <option>PENDING</option><option>CONFIRMED</option>
            <option>SHIPPED</option><option>DELIVERED</option><option>CANCELLED</option>
          </select>
          <button id="refreshOrders">Refresh</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Order</th><th>Customer</th><th>Product</th><th>Total</th><th>Status</th><th>Date</th><th>Action</th></tr></thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </section>

      <section id="customers" class="page hidden">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Phone</th><th>Address</th><th>Orders</th></tr></thead>
            <tbody id="customersBody"></tbody>
          </table>
        </div>
      </section>

      <section id="users" class="page hidden">
        <form id="userForm" class="form-card">
          <h2>Create User</h2>
          <input id="newName" placeholder="Name" required>
          <input id="newUsername" placeholder="Username" required>
          <input id="newPassword" type="password" placeholder="Password" required>
          <select id="newRole"><option value="STAFF">Staff</option><option value="ADMIN">Admin</option></select>
          <button>Create User</button>
          <p id="userMessage"></p>
        </form>
        <div class="table-wrap">
          <table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th></tr></thead><tbody id="usersBody"></tbody></table>
        </div>
      </section>
    </main>
  </div>
  <script src="admin.js"></script>
</body>
</html>
